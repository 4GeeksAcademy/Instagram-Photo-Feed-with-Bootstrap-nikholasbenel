<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Images Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white border-bottom px-3">
      <span class="navbar-brand mb-0 h1 d-flex align-items-center">
        <i class="fab fa-instagram me-2"></i> Instagram
      </span>
      <div class="d-flex align-items-center">
        <button
          class="btn btn-success me-2"
          data-bs-toggle="modal"
          data-bs-target="#newPostModal"
        >
          Create a new post
        </button>
        <div class="dropdown">
          <button
            class="btn btn-outline-secondary dropdown-toggle"
            type="button"
            id="settingsDropdown"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="fas fa-cog"></i>
          </button>
          <ul
            class="dropdown-menu dropdown-menu-end"
            aria-labelledby="settingsDropdown"
          >
            <li>
              <button
                class="dropdown-item"
                data-bs-toggle="modal"
                data-bs-target="#settingsModal"
              >
                Profile
              </button>
              <button
                class="dropdown-item"
                data-bs-toggle="modal"
                data-bs-target="#settingsModal"
              >
                Accesibility
              </button>
              <button
                class="dropdown-item"
                data-bs-toggle="modal"
                data-bs-target="#settingsModal"
              >
                Privacy and Data
              </button>
            </li>
            <li><a class="dropdown-item" href="#">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Toggle Icons -->
  <div class="text-center my-3">
  <a href="images.html" class="text-decoration-none"><i class="fas fa-th mx-2 text-gray"></i></a>
  <a href="index.html" class="text-decoration-none">
    <i class="fas fa-square mx-2 text-body-secondary"></i>
  </a>
</div>



    <!-- Images Section -->
    <div class="m-5 ">
      <div class="row justify-content-between">

        <!-- Image 1 -->
        <div class="col-md-4 mb-3">
          <img
            src="https://placedog.net/640/480"
            class="img-fluid"
            alt="Dog Image 1"
          />
        </div>

        <!-- Image 2 -->
        <div class="col-md-4">
          <img
            src="https://placedog.net/640/480"
            class="img-fluid"
            alt="Dog Image 2"
          />
        </div>

        <!-- Image 3 -->
        <div class="col-md-4">
          <img
            src="https://placedog.net/640/480"
            class="img-fluid"
            alt="Dog Image 3"
          />
        </div>
        <!-- Image 4 -->
        <div class="col-md-4">
          <img
            src="https://placedog.net/640/480"
            class="img-fluid"
            alt="Dog Image 1"
          />
        </div>

        <!-- Image 5 -->
        <div class="col-md-4">
          <img
            src="https://placedog.net/640/480"
            class="img-fluid"
            alt="Dog Image 2"
          />
        </div>

        <!-- Image 6 -->
        <div class="col-md-4">
          <img
            src="https://placedog.net/640/480"
            class="img-fluid"
            alt="Dog Image 3"
          />
        </div>
      </div>
    </div>
     <!-- New Post Modal -->
    <div
      class="modal fade"
      id="newPostModal"
      tabindex="-1"
      aria-labelledby="newPostModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content ">
          <div class="modal-header">
            <h5 class="modal-title">Create a New Post</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
           
            <div class="p-3">
                 <h5 class="p-1   " >Caption:</h5>
            <textarea
              class="form-control  "
              rows="3"
              placeholder="Write a caption..."
            ></textarea></div>
          <div class="d-flex gap-3 mb-3 p-3">
  <button type="button" class="btn btn-light border rounded">
    <i class="fa-solid fa-camera "></i>
  </button>
  <button type="button" class="btn btn-light border rounded">
    <i class="fa-solid fa-location-dot"></i>
  </button>
</div>
            <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-primary">Publish</button>
          </div>
          </div>
          
        </div>
      </div>
    </div>

    <!-- Bootstrap JS  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
